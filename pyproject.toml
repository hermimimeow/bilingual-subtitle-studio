[project]
name = "bilingual-subtitle-studio"
version = "0.1.0"
description = "Local-first bilingual subtitle generation and Final Cut Pro export tool."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "faster-whisper>=1.0.0",
    "google-genai>=1.0.0",
    "streamlit>=1.35.0",
]

[project.scripts]
bilingual-subtitle-studio = "bilingual_subtitle_studio.cli:main"
bilingual-subtitle-studio-ui = "bilingual_subtitle_studio.ui:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py311"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff.lint]
extend-select = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
